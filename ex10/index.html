<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liên hệ với chúng tôi</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <article class="the-form">
    <header>
      <h1>Liên hệ với chúng tôi</h1>
      <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
    </header>

    <form class="noi-dung-form" action="#" method="post">
      <div class="dong-2-cot">
        <div class="nhom-nhap">
          <label for="ho-ten">Họ và tên</label>
          <input type="text" id="ho-ten" name="ho_ten" placeholder="Nguyễn Văn An" required>
        </div>

        <div class="nhom-nhap">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="an.nv@tlu.edu.vn" required>
        </div>
      </div>

      <div class="dong-2-cot">
        <div class="nhom-nhap">
          <label for="dien-thoai">Số điện thoại</label>
          <input type="tel" id="dien-thoai" name="dien_thoai" placeholder="0987 654 321">
        </div>

        <div class="nhom-nhap">
          <label for="chu-de">Chủ đề</label>
          <select id="chu-de" name="chu_de">
            <option value="khoa-hoc">Hỏi về khoá học</option>
            <option value="ho-tro">Hỗ trợ kỹ thuật</option>
            <option value="khac">Khác</option>
          </select>
        </div>
      </div>

      <div class="nhom-nhap">
        <label for="noi-dung">Nội dung</label>
        <textarea id="noi-dung" name="noi_dung" rows="4" placeholder="Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ." required></textarea>
      </div>

      <div class="nhom-checkbox">
        <input type="checkbox" id="dong-y" name="dong_y" checked>
        <label for="dong-y">Tôi đồng ý nhận email phản hồi.</label>
      </div>

      <div class="nhom-nut">
        <button type="submit" class="nut-gui">Gửi liên hệ</button>
        <button type="reset" class="nut-nhap-lai">Nhập lại</button>
      </div>
    </form>
  </article>
</body>
</html>
